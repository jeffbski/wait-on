# Lint the PR title against Conventional Commits. Upstream merges PRs with merge commits, so the
# title becomes release-note history and guides reviewers.
# Runs on pull_request_target so the check also reports on fork PRs; it only reads the title from the
# event context and never checks out PR code, so it is safe.
name: PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: 🏷️ Validate PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
